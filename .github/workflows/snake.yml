# Draws the contribution graph as a snake game, in the same greys as
# lorenzopasquali.dev, and publishes the SVGs to the `output` branch that the
# README reads them from.
name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5f5f7&color_dots=#161b22,#2d2d33,#55555c,#8a8a92,#f5f5f7
            dist/snake-light.svg?palette=github-light&color_snake=#18181b&color_dots=#ebedf0,#c8c8cc,#9a9aa0,#5c5c63,#18181b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: redraw the contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
